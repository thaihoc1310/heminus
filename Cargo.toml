[workspace]
resolver = "2"
members = [
    "crates/domain",
    "crates/storage",
    "src-tauri",
]

[workspace.package]
version = "0.1.3"
edition = "2024"
rust-version = "1.95"
license = "GPL-3.0-or-later"
authors = ["Heminus contributors"]

[workspace.dependencies]
anyhow = "1.0"
chrono = { version = "0.4", features = ["serde"] }
directories = "6.0"
rusqlite = { version = "0.40.1", features = ["bundled", "chrono"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
uuid = { version = "1.0", features = ["v4", "serde"] }

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"
strip = "symbols"

[patch.crates-io]
# Keep the Shell drag image alive over both the parent window and WebView2's
# child HWND drop targets on Windows.
tao = { path = "vendor/tao" }
wry = { path = "vendor/wry" }
