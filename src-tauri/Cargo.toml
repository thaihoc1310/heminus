[package]
name = "heminus-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Tauri desktop shell for Heminus"

[lib]
name = "heminus_app"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.6", features = [] }

[dependencies]
base64 = "0.22.1"
directories.workspace = true
heminus-domain = { path = "../crates/domain" }
heminus-storage = { path = "../crates/storage" }
hmac = "0.12.1"
open = "5.4.0"
portable-pty = "0.9.0"
russh-sftp = "2.3.0"
serde.workspace = true
serde_json.workspace = true
sha1 = "0.10.6"
sha2 = "0.10.9"
ssh-key = { version = "0.6.7", features = ["ed25519", "encryption", "getrandom"] }
tauri = { version = "2.11.1", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-drag = "2.1.1"
tauri-plugin-global-shortcut = "2"
tokio = { version = "1.48", features = ["fs", "io-util", "process", "sync"] }
tracing.workspace = true
tracing-subscriber.workspace = true
uuid.workspace = true
zeroize = "1.8.2"

[target.'cfg(target_os = "linux")'.dependencies]
gdk = "0.18.2"
gio = "0.18.4"
gtk = "0.18.2"
keyring = { version = "4.1.5", default-features = false, features = ["v1", "zbus-secret-service-keyring-store"] }

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "4.1.5", default-features = false, features = ["v1", "windows-native-keyring-store"] }
netstat2 = "0.11.2"
sysinfo = "0.39.6"
whoami = "2.1.2"
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_UI_Input_KeyboardAndMouse"] }
