[package]
name = "heminus-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Tauri desktop shell for Heminus"

[lib]
name = "heminus_app"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.6", features = [] }

[dependencies]
base64 = "0.22.1"
directories.workspace = true
heminus-domain = { path = "../crates/domain" }
heminus-storage = { path = "../crates/storage" }
hmac = "0.12.1"
keyring = { version = "4.1.5", default-features = false, features = ["v1", "zbus-secret-service-keyring-store"] }
portable-pty = "0.9.0"
russh-sftp = "2.3.0"
serde.workspace = true
serde_json.workspace = true
sha1 = "0.10.6"
sha2 = "0.10.9"
ssh-key = { version = "0.6.7", features = ["ed25519", "encryption", "getrandom"] }
tauri = { version = "2.11.1", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-global-shortcut = "2"
tokio = { version = "1.48", features = ["fs", "io-util", "process", "sync"] }
tracing.workspace = true
tracing-subscriber.workspace = true
uuid.workspace = true
zeroize = "1.8.2"

[target.'cfg(target_os = "linux")'.dependencies]
gio = "0.18.4"
